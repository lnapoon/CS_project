{% load static %}
<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
  <title>{% block title %}สาขาวิชาวิทยาการคอมพิวเตอร์ มหาวิทยาลัยราชภัฏศรีสะเกษ{% endblock %}</title>
  <meta name="description" content="หลักสูตรวิทยาศาสตรบัณฑิต สาขาวิชาวิทยาการคอมพิวเตอร์ คณะศิลปศาสตร์และวิทยาศาสตร์ มหาวิทยาลัยราชภัฏศรีสะเกษ มุ่งเน้นการผลิตบัณฑิตที่มีความรู้ความสามารถด้านการพัฒนาซอฟต์แวร์ ปัญญาประดิษฐ์ และวิทยาการข้อมูล" />
  <meta name="keywords" content="วิทยาการคอมพิวเตอร์, มรภ.ศรีสะเกษ, SSKRU CS, เรียนคอมศรีสะเกษ, วิทยาศาสตรบัณฑิต, AI, Software Engineering, Computer Science SSKRU" />
  <meta name="author" content="Computer Science SSKRU" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="สาขาวิชาวิทยาการคอมพิวเตอร์ มหาวิทยาลัยราชภัฏศรีสะเกษ" />
  <meta property="og:description" content="ก้าวสู่อนาคตทางเทคโนโลยี สร้างสรรค์ซอฟต์แวร์แห่งนวัตกรรม" />
  <meta property="og:image" content="{% static 'images/hero-logo.png' %}" />

  <!-- Favicon -->
  <link rel="icon" href="{% static 'images/logo.png' %}" type="image/png" />

  <!-- Unified Google Font: Prompt (300, 400, 500, 600, 700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom Design System (Glassmorphism & Unified Typography) -->
  <link rel="stylesheet" href="{% static 'css/custom.css' %}" />

  {% block extra_css %}{% endblock %}
</head>
<body class="bg-body-tertiary">

  {% block content %}{% endblock %}

  <!-- Bootstrap 5.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS with Smooth Animations & Interactive Filters -->
  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
